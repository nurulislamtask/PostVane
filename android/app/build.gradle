plugins { id 'com.android.application' }

android {
    namespace 'com.postvane.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.postvane.app'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('pvVersionCode') ?: '1').toInteger()
        versionName (project.findProperty('pvVersionName') ?: '1.1.0')
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
