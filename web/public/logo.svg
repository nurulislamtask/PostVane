<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PostVane">
  <defs>
    <linearGradient id="pv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1A55"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pv-arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7CF3E0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#pv-bg)"/>
  <!-- V: white left arm, teal right arm that turns into an arrow (a post flying out) -->
  <path d="M122 150 L246 384" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
  <path d="M266 384 L344 236" fill="none" stroke="url(#pv-arrow)" stroke-width="58" stroke-linecap="round"/>
  <path d="M410 128 L408 268 L292 206 Z" fill="url(#pv-arrow)" stroke="url(#pv-arrow)" stroke-width="16" stroke-linejoin="round"/>
</svg>
